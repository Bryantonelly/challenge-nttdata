server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: personas-clientes-ms
              uri: http://localhost:8081
              predicates:
                - Path=/personas-clientes-ms/**
              filters:
                - StripPrefix=1

            - id: cuenta-service
              uri: http://localhost:8082
              predicates:
                - Path=/cuentas-movimientos-ms/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: gateway/routes
